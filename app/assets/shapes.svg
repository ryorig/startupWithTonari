<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 640" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="f" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".22"/><stop offset="1" stop-color="#ffffff" stop-opacity=".04"/></linearGradient>
    <linearGradient id="s" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0b1d5c" stop-opacity=".35"/><stop offset="1" stop-color="#0b1d5c" stop-opacity=".1"/></linearGradient>
    <linearGradient id="t" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c8f0ea" stop-opacity=".28"/><stop offset="1" stop-color="#c8f0ea" stop-opacity=".06"/></linearGradient>
    <linearGradient id="t0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#87C9E8" stop-opacity=".55"/><stop offset="1" stop-color="#87C9E8" stop-opacity=".15"/></linearGradient><linearGradient id="t1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6FA7EA" stop-opacity=".55"/><stop offset="1" stop-color="#6FA7EA" stop-opacity=".15"/></linearGradient><linearGradient id="t2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7F86EA" stop-opacity=".55"/><stop offset="1" stop-color="#7F86EA" stop-opacity=".15"/></linearGradient><linearGradient id="t3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9196F0" stop-opacity=".55"/><stop offset="1" stop-color="#9196F0" stop-opacity=".15"/></linearGradient>
  </defs>
  <g>
    <!-- 大きな押し出しブロック（右上） -->
    <g transform="translate(820 -60) rotate(-18)">
      <polygon points="0,0 360,0 420,-60 60,-60" fill="url(#t0)"/>
      <polygon points="360,0 420,-60 420,300 360,360" fill="url(#s)"/>
      <rect x="0" y="0" width="360" height="360" fill="url(#f)"/>
    </g>
    <!-- 斜めの長い板（中央） -->
    <g transform="translate(560 380) rotate(-34)">
      <polygon points="0,0 520,0 570,-50 50,-50" fill="url(#t1)"/>
      <polygon points="520,0 570,-50 570,90 520,140" fill="url(#s)"/>
      <rect x="0" y="0" width="520" height="140" fill="url(#f)"/>
    </g>
    <!-- 右下のブロック -->
    <g transform="translate(1120 380) rotate(14)">
      <polygon points="0,0 300,0 350,-50 50,-50" fill="url(#t2)"/>
      <polygon points="300,0 350,-50 350,250 300,300" fill="url(#s)"/>
      <rect x="0" y="0" width="300" height="300" fill="url(#f)"/>
    </g>
    <!-- 左下の小さめのブロック -->
    <g transform="translate(120 520) rotate(-10)">
      <polygon points="0,0 220,0 260,-40 40,-40" fill="url(#t3)"/>
      <polygon points="220,0 260,-40 260,140 220,180" fill="url(#s)"/>
      <rect x="0" y="0" width="220" height="180" fill="url(#f)"/>
    </g>
  </g>
</svg>
