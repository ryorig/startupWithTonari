<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SwarmBot Controller</title>
<style>
  :root { --bg:#12141a; --panel:#1d2029; --line:#2e3240; --text:#e8eaf0; --sub:#8a90a2;
          --all:#9b7bff; --ok:#3ddc84; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text);
              font-family:system-ui,-apple-system,"Hiragino Sans",sans-serif; touch-action:none; overflow:hidden; }
  body { display:flex; flex-direction:column; }
  header { display:flex; gap:8px; align-items:center; padding:8px 12px; flex-wrap:wrap; }
  h1 { font-size:15px; margin:0 8px 0 0; letter-spacing:.05em; }
  button { font:inherit; color:var(--text); background:var(--panel); border:1px solid var(--line);
           border-radius:10px; padding:8px 12px; cursor:pointer; }
  button:active { filter:brightness(1.4); }
  #bots { display:flex; gap:8px; flex-wrap:wrap; }
  .bot { display:flex; align-items:center; gap:6px; }
  .dot { width:10px; height:10px; border-radius:50%; background:#555; }
  .dot.on { background:var(--ok); box-shadow:0 0 8px var(--ok); }
  .modes { display:flex; gap:4px; margin-left:auto; flex-wrap:wrap; }
  .modes button.active { border-color:currentColor; color:var(--mc); }
  main { display:flex; justify-content:space-around; align-items:center; flex:1; min-height:0; gap:12px; padding:0 12px; }
  .pad { display:flex; flex-direction:column; align-items:center; gap:10px; }
  .pad .label { font-size:13px; font-weight:600; color:var(--c); }
  .pad .hint { font-size:11px; color:var(--sub); }
  .ctrl { display:flex; gap:18px; align-items:center; }
  .stick { position:relative; width:var(--size,200px); aspect-ratio:1; border-radius:50%;
           background:radial-gradient(circle,#262a36 0,#1a1d25 70%); border:2px solid var(--line); }
  .knob { position:absolute; left:50%; top:50%; width:38%; aspect-ratio:1; border-radius:50%;
          transform:translate(-50%,-50%); background:var(--c,#888); opacity:.9; box-shadow:0 4px 14px #0008; }
  .dpad { display:grid; grid-template-columns:repeat(3,var(--k,48px)); grid-template-rows:repeat(3,var(--k,48px)); gap:4px; }
  .dpad button { padding:0; font-size:18px; border-radius:8px; }
  .dpad button.held { background:var(--c,#555); }
  .dpad .stop { font-size:11px; color:#ff8080; }
  footer { display:flex; gap:16px; align-items:center; justify-content:center; padding:6px 12px 10px; font-size:12px; color:var(--sub); flex-wrap:wrap; }
  input[type=range] { width:140px; }
  #estop { background:#b3261e; border-color:#b3261e; font-weight:700; color:#fff; }
  .hidden { display:none !important; }
  .warn { background:#5a2a00; color:#ffd7a8; padding:8px 12px; font-size:13px; }
  @media (max-width:800px) { main { flex-wrap:wrap; overflow:auto; } }
</style>
</head>
<body>
<div id="nobt" class="warn hidden">このブラウザは Web Bluetooth 非対応です。Android / PC の Chrome または Edge で開いてください（iPhoneは「Bluefy」アプリで可）。</div>
<header>
  <h1>SwarmBot</h1>
  <div id="bots"></div>
  <div class="modes" id="modes"></div>
</header>
<main id="main"></main>
<footer>
  <label>速度 <input type="range" id="speed" min="20" max="100" value="70"> <span id="speedv">70%</span></label>
  <button id="estop">■ 全停止</button>
  <span id="keyhint"></span>
</footer>

<script>
// ===== 台数はここで変更 =====
const N = 3;
const COLORS = ['#ff6b5a', '#3fa9ff', '#3ddc84', '#ffc94a', '#ff7ad9', '#4ae0e0'];
// 個別モードのキーボード割当 (1号機, 2号機, 3号機 ...)
const KEYSETS = [
  { up:'ArrowUp', down:'ArrowDown', left:'ArrowLeft', right:'ArrowRight', name:'矢印' },
  { up:'w', down:'s', left:'a', right:'d', name:'WASD' },
  { up:'i', down:'k', left:'j', right:'l', name:'IJKL' },
  { up:'t', down:'g', left:'f', right:'h', name:'TFGH' },
];

const SVC = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
const RX  = '6e400002-b5a3-f393-e0a9-e50e24dcca9e';
const TX  = '6e400003-b5a3-f393-e0a9-e50e24dcca9e';

if (!window.isSecureContext) {
  const w = document.getElementById('nobt');
  w.textContent = 'この URL では Bluetooth が使えません。アドレスバーに http://localhost:' + (location.port || '8000') + ' と入力して開き直してください（https か localhost が必要）。';
  w.classList.remove('hidden');
} else if (!navigator.bluetooth) document.getElementById('nobt').classList.remove('hidden');

// ---------- BLE ----------
class Robot {
  constructor(id) {
    this.id = id; this.dev = null; this.rx = null; this.busy = false; this.last = ''; this.lastSent = 0;
    const wrap = document.createElement('div'); wrap.className = 'bot';
    this.dot = document.createElement('span'); this.dot.className = 'dot';
    this.btn = document.createElement('button'); this.btn.style.color = COLORS[id - 1];
    this.btn.textContent = id + '号機 接続'; this.btn.onclick = () => this.connect();
    wrap.append(this.dot, this.btn); document.getElementById('bots').appendChild(wrap);
  }
  get ok() { return !!this.rx && this.dev?.gatt.connected; }
  async connect() {
    if (this.ok) { this.dev.gatt.disconnect(); return; }
    try {
      const dev = await navigator.bluetooth.requestDevice({
        filters: [{ services: [SVC] }, { namePrefix: 'SwarmBot' }], optionalServices: [SVC] });
      const dup = robots.find(r => r !== this && r.dev && r.dev.id === dev.id);
      if (dup) { alert('その機体は既に' + dup.id + '号機として接続済みです'); return; }
      this.dev = dev;
      dev.addEventListener('gattserverdisconnected', () => this.onDisc());
      const s = await (await dev.gatt.connect()).getPrimaryService(SVC);
      this.rx = await s.getCharacteristic(RX);
      try { const tx = await s.getCharacteristic(TX); await tx.startNotifications();
            tx.addEventListener('characteristicvaluechanged', e => {
              const t = new TextDecoder().decode(e.target.value); this.btn.title = t;
              const m = t.match(/^ID(\d+)/);   // 機体が名乗るIDを表示 (Macの名前キャッシュ対策)
              if (m) this.btn.textContent = this.id + '号機 切断 (実機ID ' + m[1] + ')';
            }); } catch {}
      this.dot.classList.add('on');
      this.btn.textContent = this.id + '号機 切断 (' + dev.name + ')';
    } catch (e) { console.warn(e); if (e.name !== 'NotFoundError') alert('接続失敗: ' + e.message); }
  }
  onDisc() { this.rx = null; this.dot.classList.remove('on'); this.btn.textContent = this.id + '号機 接続'; }
  async send(l, r, force = false) {
    if (!this.ok || this.busy) return;
    const msg = (l === 0 && r === 0) ? 'S\n' : `M,${l},${r}\n`;
    const now = performance.now();
    if (!force && msg === this.last && now - this.lastSent < 200) return; // 200ms毎にキープアライブ
    this.busy = true;
    try {
      const data = new TextEncoder().encode(msg);
      if (this.rx.writeValueWithoutResponse) await this.rx.writeValueWithoutResponse(data);
      else await this.rx.writeValue(data);
      this.last = msg; this.lastSent = now;
    } catch (e) { console.warn(e); }
    this.busy = false;
  }
}
const robots = Array.from({ length: N }, (_, i) => new Robot(i + 1));

// ---------- 入力 ----------
// pads[i] = { sx, sy, dx, dy }   個別モードでは pads[i] が i+1号機、それ以外は pads[0] のみ使用
const pads = Array.from({ length: N }, () => ({ sx:0, sy:0, dx:0, dy:0 }));
const keys = new Set();

function makePad(i, title, color, compact) {
  const p = pads[i];
  const el = document.createElement('div'); el.className = 'pad'; el.style.setProperty('--c', color);
  el.innerHTML = `<div class="label">${title}</div><div class="ctrl"><div class="stick"><div class="knob"></div></div><div class="dpad"></div></div><div class="hint"></div>`;
  const stick = el.querySelector('.stick'), knob = el.querySelector('.knob'), dpad = el.querySelector('.dpad');
  stick.style.setProperty('--size', compact ? 'min(26vw,170px)' : 'min(42vw,220px)');
  dpad.style.setProperty('--k', compact ? '40px' : '50px');

  let pid = null;
  const move = e => {
    const r = stick.getBoundingClientRect(), R = r.width / 2;
    let x = (e.clientX - r.left - R) / R, y = (e.clientY - r.top - R) / R;
    const m = Math.hypot(x, y); if (m > 1) { x /= m; y /= m; }
    p.sx = x; p.sy = -y;
    knob.style.transform = `translate(calc(-50% + ${x*R*0.7}px), calc(-50% + ${y*R*0.7}px))`;
  };
  const end = () => { pid = null; p.sx = p.sy = 0; knob.style.transform = 'translate(-50%,-50%)'; };
  stick.addEventListener('pointerdown', e => { pid = e.pointerId; stick.setPointerCapture(pid); move(e); });
  stick.addEventListener('pointermove', e => { if (e.pointerId === pid) move(e); });
  stick.addEventListener('pointerup', end); stick.addEventListener('pointercancel', end);

  const layout = [null,['▲',0,1],null, ['◀',-1,0],['STOP'],['▶',1,0], null,['▼',0,-1],null];
  for (const b of layout) {
    if (!b) { dpad.appendChild(document.createElement('span')); continue; }
    const [t, x, y] = b, btn = document.createElement('button'); btn.textContent = t;
    if (t === 'STOP') { btn.className = 'stop'; btn.onpointerdown = stopAll; dpad.appendChild(btn); continue; }
    const on = e => { e.preventDefault(); btn.setPointerCapture?.(e.pointerId); btn.classList.add('held'); p.dx = x; p.dy = y; };
    const off = () => { btn.classList.remove('held'); if (p.dx === x && p.dy === y) p.dx = p.dy = 0; };
    btn.addEventListener('pointerdown', on); btn.addEventListener('pointerup', off);
    btn.addEventListener('pointercancel', off); btn.addEventListener('pointerleave', off);
    dpad.appendChild(btn);
  }
  return el;
}

addEventListener('keydown', e => {
  if (e.key === ' ') { stopAll(); e.preventDefault(); return; }
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (KEYSETS.some(s => Object.values(s).includes(k))) { keys.add(k); e.preventDefault(); }
});
addEventListener('keyup', e => keys.delete(e.key.length === 1 ? e.key.toLowerCase() : e.key));
addEventListener('blur', () => keys.clear());
function keyVec(set) {
  return [(keys.has(set.right) ? 1 : 0) - (keys.has(set.left) ? 1 : 0),
          (keys.has(set.up) ? 1 : 0) - (keys.has(set.down) ? 1 : 0)];
}

// ---------- モード ----------
// 'all' = 全台同時, 数字 = その号機のみ, 'split' = 個別
const MODES = [['all', N + '台同時', 'var(--all)'],
  ...robots.map(r => [String(r.id), r.id + '号機', COLORS[r.id - 1]]),
  ['split', '個別', '#ffc94a']];
let mode = 'all';
const modesEl = document.getElementById('modes');
for (const [m, label, color] of MODES) {
  const b = document.createElement('button'); b.textContent = label; b.dataset.m = m; b.style.setProperty('--mc', color);
  if (m === mode) b.classList.add('active');
  b.onclick = () => { modesEl.querySelectorAll('button').forEach(x => x.classList.remove('active'));
                      b.classList.add('active'); mode = m; stopAll(); render(); };
  modesEl.appendChild(b);
}

function render() {
  const main = document.getElementById('main'); main.innerHTML = '';
  if (mode === 'split') {
    robots.forEach((r, i) => {
      const el = makePad(i, r.id + '号機', COLORS[i], true);
      if (KEYSETS[i]) el.querySelector('.hint').textContent = 'キー: ' + KEYSETS[i].name;
      main.appendChild(el);
    });
    document.getElementById('keyhint').textContent = 'Space=全停止';
  } else {
    const label = mode === 'all' ? N + '台同時' : mode + '号機';
    const color = mode === 'all' ? 'var(--all)' : COLORS[+mode - 1];
    main.appendChild(makePad(0, label, color, false));
    document.getElementById('keyhint').textContent = 'キーボード: 矢印 / WASD・Space=全停止';
  }
}
render();

const speed = document.getElementById('speed');
speed.oninput = () => document.getElementById('speedv').textContent = speed.value + '%';

// ---------- 差動二輪ミキシング ----------
function mix(x, y) {
  if (Math.hypot(x, y) < 0.12) return [0, 0];          // デッドゾーン
  let l = y + x, r = y - x;
  const m = Math.max(1, Math.abs(l), Math.abs(r)); l /= m; r /= m;
  const k = 255 * speed.value / 100;
  return [Math.round(l * k), Math.round(r * k)];
}
function padVec(i, keyVecs) {
  const p = pads[i];
  let x = p.sx, y = p.sy;
  if (p.dx || p.dy) { x = p.dx; y = p.dy; }
  for (const [kx, ky] of keyVecs) if (kx || ky) { x = kx; y = ky; }
  if (Math.abs(x) === 1 && Math.abs(y) === 1) x *= 0.5;  // 斜め=カーブ
  return [x, y];
}

function tick() {
  if (mode === 'split') {
    robots.forEach((r, i) => r.send(...mix(...padVec(i, KEYSETS[i] ? [keyVec(KEYSETS[i])] : []))));
  } else {
    const cmd = mix(...padVec(0, [keyVec(KEYSETS[0]), keyVec(KEYSETS[1])]));
    robots.forEach(r => (mode === 'all' || +mode === r.id) ? r.send(...cmd) : r.send(0, 0));
  }
}
setInterval(tick, 50);   // 20Hz

function stopAll() {
  pads.forEach(p => Object.assign(p, { sx:0, sy:0, dx:0, dy:0 }));
  keys.clear(); robots.forEach(r => r.send(0, 0, true));
}
document.getElementById('estop').onclick = stopAll;
document.addEventListener('visibilitychange', () => { if (document.hidden) stopAll(); });
</script>
</body>
</html>
